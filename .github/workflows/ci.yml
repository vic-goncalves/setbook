name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  swift:
    runs-on: macos-15
    defaults:
      run:
        working-directory: Packages/SetbookKit
    steps:
      - uses: actions/checkout@v7
      # GRDB pulls a git submodule; retry transient network failures before testing.
      - name: Resolve packages
        run: |
          for attempt in 1 2 3; do
            swift package resolve && exit 0
            echo "resolve failed (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          exit 1
      - run: swift test
